<!--TELA DE LOGIN-->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anjos de Resgate</title>
    
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0A2540;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }
        
        .bg-layer {
            position: absolute;
            inset: 0;
            background: 
                linear-gradient(rgba(10, 37, 64, 0.82), rgba(10, 37, 64, 0.90)),
                url('imagens/cao-gato.png') center/cover no-repeat;
            z-index: 1;
        }

        .watermark {
            position: absolute;
            bottom: 1.25rem;
            right: 1.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: #FFFFFF;
            opacity: 0.25;
            text-transform: uppercase;
            z-index: 2;
            pointer-events: none;
        }
        
        .login-card {
            position: relative;
            z-index: 2;
            background-color: #FFFFFF;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
        }

        .header-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tagline {
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 700;
            color: #0A2540;
            opacity: 0.75;
            margin-bottom: 0.25rem;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.75rem;
            line-height: 1;
            letter-spacing: 0.04em;
            color: #0A2540;
        }

        .accent-bar {
            width: 48px;
            height: 4px;
            background-color: #F4B41A;
            margin: 0.5rem auto 0;
            border-radius: 2px;
        }
        
        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #111827;
            margin-bottom: 0.35rem;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            color: #111827;
            background-color: #F9FAFB;
            border: 1.5px solid #E5E7EB;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #F4B41A;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(244, 180, 26, 0.25);
        }

        .forgot-password-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.4rem;
        }

        .forgot-password-link {
            font-size: 0.8rem;
            font-weight: 500;
            color: #0A2540;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s, color 0.2s;
        }

        .forgot-password-link:hover {
            opacity: 1;
            color: #F4B41A;
            text-decoration: underline;
        }

        /* Botão Principal */
        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background-color: #0A2540;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: #07192c;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }
       
        .btn-secondary {
            width: 100%;
            padding: 0.75rem;
            background: transparent;
            color: #0A2540;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            font-weight: 600;
            border: 1.5px solid #0A2540;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 0.75rem;
            transition: background-color 0.2s, color 0.2s;
        }

        .btn-secondary:hover {
            background-color: rgba(10, 37, 64, 0.05);
            border-color: #F4B41A;
            color: #0A2540;
        }
    </style>
</head>

<body>
    <div class="bg-layer"></div>

    <main class="login-card">
        <header class="header-section">
            <p class="tagline">Anjos de Resgate</p>
            <h1>Acesso Restrito</h1>
            <div class="accent-bar"></div>
        </header>

        <form onsubmit="event.preventDefault(); window.location.href = './pages/casca.html';">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
                <div class="forgot-password-wrapper">
                    <a href="./pages/recuperar-senha.html" class="forgot-password-link">Esqueci a minha senha</a>
                </div>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
            <button type="button" class="btn-secondary" onclick="window.location.href = './pages/casca.html'">
                Inicio &rarr;
            </button>
        </form>
    </main>

    <div class="watermark">PETEC</div>
</body>

</html>
